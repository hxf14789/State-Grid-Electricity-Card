name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release with dist asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/elec-dashboard.js
          generate_release_notes: true
